<style>
  :root{
    --morado:#111111; --morado-2:#333333; --amarillo:#FFC52E;
    --fondo:#F4F4F4; --tarjeta:#FFFFFF; --texto:#111111; --suave:#666666; --linea:#E4E4E4;
    --verde:#0E6B4E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--texto);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit}
  header{background:var(--morado);color:#fff;padding:14px 16px 16px}
  .cab{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto}
  .marca{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
  .marca .logo{display:block;width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--amarillo)}
  .marca .logo img{display:block;width:44px;height:44px;filter:grayscale(1) contrast(4);mix-blend-mode:multiply}
  .marca b{display:block;font-size:18px;letter-spacing:.2px}
  .marca span{font-size:12px;opacity:.85}
  .ir-cat{color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap}
  .barra{position:sticky;top:0;z-index:5;background:var(--fondo);padding:10px 16px 8px;border-bottom:1px solid var(--linea)}
  .barra .dentro{max-width:760px;margin:0 auto}
  #q{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:12px;font-size:16px;background:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--linea);background:#fff;color:var(--texto);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--morado);border-color:var(--morado);color:#fff}
  .chip .n{opacity:.7;margin-left:4px;font-size:12px;font-weight:500}
  main{max-width:760px;margin:0 auto;padding:12px 16px 120px}
  .migas{font-size:13px;color:var(--suave);margin:4px 0 10px}
  .migas button{border:0;background:none;color:var(--morado);font-weight:700;padding:0;cursor:pointer;font-size:13px}
  h2{font-size:20px;margin:6px 0 4px}
  .sub{color:var(--suave);font-size:13px;margin:0 0 14px}
  .marcas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .marca-btn{border:0;border-radius:18px;padding:22px 12px;color:#fff;cursor:pointer;text-align:center;
    background:linear-gradient(145deg,var(--morado-2),var(--morado));box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .marca-btn:nth-child(even){background:linear-gradient(145deg,#3A3A3A,#1A1A1A)}
  .marca-btn .nom{display:block;font-size:22px;font-weight:800}
  .marca-btn .uni{display:inline-block;margin-top:8px;background:var(--amarillo);color:#3a2a00;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
  .modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .modelo-btn{border:1px solid var(--linea);background:#fff;border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer}
  .modelo-btn b{display:block;font-size:15px}
  .modelo-btn span{font-size:12px;color:var(--suave)}
  .modelo-btn:active,.marca-btn:active{transform:scale(.98)}
  .grupo{background:#fff;border:1px solid var(--linea);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .grupo-cab{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#FAFAFA;border-bottom:1px solid var(--linea)}
  .grupo-cab h3{margin:0;font-size:16px}
  .grupo-cab span{font-size:12px;color:var(--suave)}
  .rep{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--linea);align-items:center}
  .rep:first-of-type{border-top:0}
  .rep .t{font-weight:700}
  .cal{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#F1F1F1;color:var(--morado);margin-left:6px;vertical-align:1px}
  .rep .o{font-size:12px;color:var(--suave);grid-column:1}
  .rep .p{font-size:18px;font-weight:800;color:var(--morado);text-align:right;white-space:nowrap}
  .rep .acc{grid-column:1 / -1;display:flex;gap:8px;margin-top:6px}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-add{background:var(--morado);color:#fff}
  .btn-wa{background:#fff;color:var(--verde);border:1px solid #BFE3D2}
  .paso{display:inline-flex;align-items:center;gap:8px;background:#F1F1F1;border-radius:10px;padding:4px}
  .paso button{border:0;background:#fff;color:var(--morado);width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:800;cursor:pointer}
  .paso span{font-size:13px;font-weight:700;color:var(--morado);min-width:70px;text-align:center}
  .vacio{background:#fff;border:1px dashed var(--linea);border-radius:14px;padding:22px;text-align:center;color:var(--suave)}
  .info{margin-top:18px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;font-size:13px;color:var(--suave)}
  .info b{color:var(--texto)}
  .barra-pedido{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--morado);color:#fff;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .barra-pedido[hidden]{display:none}
  .barra-pedido b{font-size:16px}
  .barra-pedido button{border:0;background:var(--amarillo);color:#3a2a00;font-weight:800;border-radius:10px;padding:10px 14px;cursor:pointer}

  [/\bAO(\d)/g, 'A0$1'], [/\bNOA\b/g, 'NOVA'], [/\bPOXO\b/g, 'POCO'], [/\b(REMDI|RD|RM)\b/g, 'REDMI'], [/\bHOTE\b/g, 'HOT'],

var PREFIJOS = { 'iphone': /^(IPHONE|IP)\s+/, 'samsung': /^SAMSUNG\s+/, 'motorola': /^MOTO\s+/, 'nokia': /^NOKIA\s+/, 'realme': /^REALME\s+/ };

/** "13 PRO MAX OLED" → { modelos: ['13 PRO MAX'], var: ['OLED'] } (null si no parece un modelo) */
function leerNombre(marca, nombre){
  var s = String(nombre || '').toUpperCase().replace(/[–—]/g, '-').trim(), vars = [], km = slug(marca);

var RANGO_IPHONE = { '': 0, 'C': 1, 'PLUS': 2, 'S': 3, 'S PLUS': 4, 'E': 5, 'MINI': -1, 'AIR': 2.5, 'PRO': 6, 'PRO MAX': 7 };

    marcas.forEach(function(o){

      o.b.forEach(function(t){ if (slug(t.t) === m.s && /glass|oca/.test(norm(o.n))) tablas.push({ t: t, tipo: { k: 'glass', n: o.n } }); });
    });
    tablas.forEach(function(x){
      x.t.items.forEach(function(it){
        total++;
        var r = leerNombre(m.n, it.modelo);
        // Memorias NAND de iPhone: "SERIES 13 256GB" sirve para toda la serie 13
        var serie = slug(m.n) === 'iphone' && String(it.modelo).toUpperCase().match(/^SERIES?\s+(\d+(?:\s*\/\s*\d+)*)\s*(.*)$/);
        if (serie) { r = { serie: serie[1].split('/').map(function(z){ return z.trim(); }), vars: [serie[2].trim()].filter(Boolean), nota: '' }; }
        if (!r) { sinModelo.push(it); return; }
        it.vars = r.vars; it.notaModelo = r.nota; it.tipoK = x.tipo.k;
        (r.modelos || []).forEach(function(k){
          var md = mods[k] = mods[k] || { k: k, tipos: {} };
          var tp = md.tipos[x.tipo.k] = md.tipos[x.tipo.k] || { k: x.tipo.k, n: x.tipo.n, items: [], tablas: [] };
          if (tp.items.indexOf(it) < 0) tp.items.push(it);
          if (tp.tablas.indexOf(x.t.t) < 0) tp.tablas.push(x.t.t);
          it.sirve = r.modelos;
        });
        if (r.serie) it.pendienteSerie = { series: r.serie, tipo: x.tipo, tabla: x.t.t };
      });
    });
    // Asigna las piezas "por serie" a cada modelo de esa serie
    tablas.forEach(function(x){ x.t.items.forEach(function(it){
      if (!it.pendienteSerie) return;
      var ps = it.pendienteSerie, aplica = Object.keys(mods).filter(function(k){ return ps.series.indexOf(k.split(' ')[0].replace(/\D/g, '')) >= 0 && /^\d/.test(k); });
      if (!aplica.length) { sinModelo.push(it); return; }
      it.sirve = aplica.map(function(k){ return k; });
      aplica.forEach(function(k){
        var tp = mods[k].tipos[ps.tipo.k] = mods[k].tipos[ps.tipo.k] || { k: ps.tipo.k, n: ps.tipo.n, items: [], tablas: [] };
        tp.items.push(it); if (tp.tablas.indexOf(ps.tabla) < 0) tp.tablas.push(ps.tabla);
      });
    }); });
    var lista = Object.keys(mods).map(function(k){
      var md = mods[k];
      md.nombre = nombreModelo(m.n, k); md.s = slug(md.nombre); md.fam = familia(m.n, k); md.orden = claveOrden(m.n, k);
      md.lista = Object.keys(md.tipos).map(function(t){ return md.tipos[t]; }).sort(function(a, b){
        var ia = ORDEN_TIPOS.indexOf(a.k), ib = ORDEN_TIPOS.indexOf(b.k);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.n.localeCompare(b.n);

      return md;
    }).sort(function(a, b){ return compararOrden(a.orden, b.orden); });
    var conModelo = total - sinModelo.length, tiposPorModelo = lista.length ? lista.reduce(function(s, x){ return s + x.lista.length; }, 0) / lista.length : 0;
    m.modelos = lista; m.sinModelo = sinModelo;
    // Solo usa "por modelo" si casi todo se reconoce y los modelos tienen varios tipos de repuesto
    m.porModelo = MODO_MODELO.test(norm(m.n)) && lista.length >= 3 && total && conModelo / total >= 0.75 && tiposPorModelo >= 1.4 && m.b.length >= 2;
    m.stats = { total: total, conModelo: conModelo, modelos: lista.length, tpm: Math.round(tiposPorModelo * 10) / 10 };
  });
}

/** "Baterías iPhone Sin Bms" → "Sin Bms" (lo que distingue a esa tabla dentro de su tipo) */
function calificador(titulo, tipoN, marcaN){
  var fuera = norm(tipoN + ' ' + marcaN + ' de y la las los para iphone samsung xiaomi huawei pantallas baterias bateria flex carga camaras camara tapas traseras tapaderas').split(' ');
  var w = String(titulo).replace(/\(.*?\)/g, ' ').split(/\s+/).filter(Boolean), res = [];
  for (var i = 0; i < w.length; i++) {
    var n = norm(w[i]);
    if (/^(serie|series|linea)$/.test(n)) break;
    if (fuera.indexOf(n) >= 0 || fuera.indexOf(n.replace(/s$/, '')) >= 0) continue;
    res.push(w[i]);
  }
  return res.join(' ');
}

var marcas = [], items = [], porId = {};

function recibir(d){
  marcas = d.marcas || []; items = []; porId = {};
  marcas.forEach(function(m){
    m.s = slug(m.n);
    m.b.forEach(function(t){
      t.s = slug(t.t); t.items = [];
      t.i.forEach(function(r){
        var x = { id: m.s + '|' + t.s + '|' + norm(r[0]), marca: m.n, tabla: t.t, modelo: r[0], precios: r[1] || [], etiquetas: t.p || [], nota: r[2] || '', nuevo: !!r[3] };
        x.precio = 0; for (var k = 0; k < x.precios.length; k++) { if (num(x.precios[k])) { x.precio = num(x.precios[k]); break; } }
        if (porId[x.id]) return;            // filas repetidas
        porId[x.id] = x; t.items.push(x); items.push(x);
      });
    });
  });
  try { armarModelos(marcas); } catch (e) { marcas.forEach(function(m){ m.porModelo = false; }); }
  // La búsqueda también entiende el nombre completo del modelo ("redmi note 12 pro", "iphone 13 pro max")
  marcas.forEach(function(m){ (m.modelos || []).forEach(function(md){ md.lista.forEach(function(tp){ tp.items.forEach(function(x){ x.extra = (x.extra || '') + ' ' + md.nombre + ' ' + tp.n; }); }); }); });
  items.forEach(function(x){ x.busca = norm([x.marca, x.tabla, x.modelo, x.nota, x.extra || ''].join(' ')); });
  Object.keys(pedido).forEach(function(id){ if (!porId[id]) delete pedido[id]; });
  leerHash(); pintar(); pintarPedido();
}

}
function pintarTablas(app, m){
  app.innerHTML = migas([[m.n, m.s]]) + (m.porModelo ? regresar(m.s, 'Buscar por modelo') : '') + '<h2>' + esc(m.n) + '</h2><p class="sub">Elige el tipo de repuesto.</p>' +
    '<div class="tablas">' + m.b.map(function(x){ var nuevos = x.items.filter(function(i){ return i.nuevo; }).length;
      var tk = tipoDe(x.t).k;
      return '<button class="tabla-btn" data-ir="' + m.s + '/t/' + x.s + '"><span class="ico">' + iconoTipo(tk.indexOf('otro-') === 0 ? 'otro' : tk) + '</span><div><b>' + esc(x.t) + '</b>' + (nuevos ? '<span class="nuevo">' + nuevos + ' NUEVO' + (nuevos === 1 ? '' : 'S') + '</span>' : '') + '<br><span>' + x.items.length + (x.items.length === 1 ? ' modelo' : ' modelos') + '</span></div><span class="flecha">›</span></button>'; }).join('') + '</div>';
}
function pintarTabla(app, m, t){
  app.innerHTML = migas([[m.n, m.s], [t.t, '']]) + regresar(m.s + (m.porModelo ? '/tipos' : ''), 'Ver otros repuestos de ' + m.n) +
    '<h2>' + esc(t.t) + '</h2><p class="sub">' + t.items.length + (t.items.length === 1 ? ' modelo' : ' modelos') + ' · precios de mayoreo</p>' +
    '<section class="grupo">' + t.items.map(function(x){ return filaRep(x, false); }).join('') + '</section>';
}
function pintarOtros(app, m){
  app.innerHTML = migas([[m.n, m.s], ['Otros repuestos', '']]) + regresar(m.s, 'Ver todos los modelos ' + m.n) +
    '<h2>Otros repuestos de ' + esc(m.n) + '</h2><p class="sub">Repuestos que no son de un modelo en específico.</p>' +
    '<section class="grupo">' + m.sinModelo.map(function(x){ return filaRep(x, true); }).join('') + '</section>';
}
function pintarBusqueda(app){
  var palabras = norm(vista.q).split(' ');
  var res = items.filter(function(x){ return palabras.every(function(p){ return x.busca.indexOf(p) >= 0; }); });
  var g = {}, orden = [];
  res.slice(0, 200).forEach(function(x){ var k = x.marca + ' · ' + x.tabla; if (!g[k]) { g[k] = []; orden.push(k); } g[k].push(x); });
  app.innerHTML = '<h2>Resultados</h2><p class="sub">' + res.length + (res.length === 1 ? ' repuesto encontrado' : ' repuestos encontrados') + ' para «' + esc(vista.q) + '»' + (res.length > 200 ? ' (se muestran 200; escribe algo más específico)' : '') + '</p>' +
    (res.length ? orden.map(function(k){ return '<section class="grupo"><div class="grupo-cab"><h3>' + esc(k) + '</h3><span>' + g[k].length + '</span></div>' + g[k].map(function(x){ return filaRep(x, false); }).join('') + '</section>'; }).join('')
      : '<div class="vacio">No encontramos ese repuesto. <a href="' + linkWA('Hola, busco este repuesto: ' + vista.q) + '" target="_blank" rel="noopener">Pregúntanos por WhatsApp</a>, puede que lo tengamos.</div>');
}
function info(){
  return '<div class="info"><b>Retiro en tienda:</b> 7a Av. Norte 2-9, Santa Tecla, La Libertad · <b>Horario:</b> lunes a sábado, 8 a.m. a 5 p.m. · Envíos personalizados y departamentales. ' +
    '<br><b>Pagos:</b> efectivo y transferencia. Precios sujetos a cambio; confirma disponibilidad por WhatsApp.</div>';
}

// ===== Pedido =====
function nombreRep(x){ return x.tabla + ' — ' + x.modelo; }
function linkWA(t){ return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t); }
function cambiar(id, d){
  var n = Math.max(0, (pedido[id] || 0) + d);
  if (n) pedido[id] = n; else delete pedido[id];
  guardar(GUARDA_PED, pedido); pintar(); pintarPedido();
  if (d > 0 && n === 1) aviso('Agregado a tu pedido');
}
function lineasPedido(){ return Object.keys(pedido).map(function(id){ var x = porId[id]; return x ? { x: x, n: pedido[id] } : null; }).filter(Boolean); }
function pintarPedido(){
  var ls = lineasPedido(), n = ls.reduce(function(s, l){ return s + l.n; }, 0), t = ls.reduce(function(s, l){ return s + l.n * l.x.precio; }, 0);
  $('barraPedido').hidden = !n; $('bpN').textContent = n + (n === 1 ? ' repuesto' : ' repuestos'); $('bpT').textContent = dinero(t);
  $('pedTotal').textContent = dinero(t);
  $('pedLista').innerHTML = ls.length ? ls.map(function(l){
    return '<div class="linea"><div><div class="t">' + esc(l.x.modelo) + '</div><div class="s">' + esc(l.x.marca + ' · ' + l.x.tabla) + ' · ' + dinero(l.x.precio) + ' c/u</div></div>' +
      '<span class="paso"><button data-menos="' + esc(l.x.id) + '">−</button><span>' + l.n + '</span><button data-mas="' + esc(l.x.id) + '">+</button></span></div>';
  }).join('') : '<p class="sub" style="padding:14px 0">Tu pedido está vacío.</p>';
  if (!ls.length) $('modalPedido').hidden = true;
}
$('verPedido').addEventListener('click', function(){ $('pedTaller').value = leer(GUARDA_TALLER, ''); $('modalPedido').hidden = false; });
$('cerrarPedido').addEventListener('click', function(){ $('modalPedido').hidden = true; });
$('modalPedido').addEventListener('click', function(e){ if (e.target === $('modalPedido')) $('modalPedido').hidden = true; });
$('vaciarPedido').addEventListener('click', function(){ pedido = {}; guardar(GUARDA_PED, pedido); pintar(); pintarPedido(); });
$('enviarPedido').addEventListener('click', function(){
  var ls = lineasPedido(); if (!ls.length) return;
  var taller = $('pedTaller').value.trim(); guardar(GUARDA_TALLER, taller);
  var t = ls.reduce(function(s, l){ return s + l.n * l.x.precio; }, 0);
  var msg = 'Hola, quiero hacer este pedido de repuestos' + (taller ? ' (' + taller + ')' : '') + ':\n\n' +
    ls.map(function(l){ return '• ' + nombreRep(l.x) + ' x' + l.n + ' — ' + dinero(l.n * l.x.precio); }).join('\n') +
    '\n\nTotal: ' + dinero(t);
  window.open(linkWA(msg), '_blank');
});

// ===== Eventos =====
document.addEventListener('click', function(e){
  var mas = e.target.closest('[data-mas]'); if (mas) { cambiar(mas.getAttribute('data-mas'), 1); return; }
  var menos = e.target.closest('[data-menos]'); if (menos) { cambiar(menos.getAttribute('data-menos'), -1); return; }
  var b = e.target.closest('[data-ir]'); if (b) { ir(b.getAttribute('data-ir')); }
});
var deb;
$('q').addEventListener('input', function(e){ clearTimeout(deb); deb = setTimeout(function(){ vista.q = e.target.value.trim(); pintar(); }, 150); });

// Abre al instante con la última copia y se actualiza
var copia = leer(GUARDA, null);
if (copia) recibir(copia);
cargar();
window.addEventListener('focus', cargar);
setInterval(function(){ if (!document.hidden) cargar(); }, 180000);
</script>
